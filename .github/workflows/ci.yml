name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            db-tests/package-lock.json
            web/package-lock.json
            notifier/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run setup
      - name: Database tests (schema, RLS, workflows)
        run: npm run test:db
      - name: Web typecheck + unit + contract tests
        run: npm run test:web
      - name: Notifier tests
        run: npm run test:notifier
      - name: Deploy script tests
        run: npm run test:deploy && bash -n deploy/scripts/*.sh
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://pm.apillis.lan
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
